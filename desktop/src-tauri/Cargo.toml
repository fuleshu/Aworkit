[package]
name = "aworkit-desktop"
default-run = "aworkit-desktop"
version = "0.1.0"
description = "Aworkit desktop presentation shell"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
aworkit-capability-host = { path = "../../crates/aworkit-capability-host" }
aworkit-local-store = { path = "../../crates/aworkit-local-store" }
aworkit-process = { path = "../../crates/aworkit-process" }
aworkit-protocol = { path = "../../crates/aworkit-protocol" }
aworkit-trusted-core = { path = "../../crates/aworkit-trusted-core" }
aworkit-workflow-worker = { path = "../../crates/aworkit-workflow-worker" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
url = "2.5"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "UI_ViewManagement"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
