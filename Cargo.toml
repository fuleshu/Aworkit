[workspace]
members = [
  "crates/aworkit-protocol",
  "crates/aworkit-process",
  "crates/aworkit-process-platform",
  "crates/aworkit-trusted-core",
  "crates/aworkit-workflow-worker",
  "crates/aworkit-capability-host",
  "crates/aworkit-local-store",
  "crates/aworkit-portable-store",
  "crates/aworkit-bootstrap-helper",
]
resolver = "3"
exclude = ["desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Build hygiene: Cargo never prunes stale incremental flavours or superseded hashed
# artifacts, so keep the profile bounded here and prune the cache periodically with
# `node scripts/trim-rust-incremental.mjs`. See desktop/src-tauri/Cargo.toml for the
# same policy applied to the desktop app (which is excluded from this workspace).
[profile.dev]
debug = 1
incremental = true

[profile.dev.build-override]
debug = false
incremental = false

[profile.test]
debug = 1
incremental = true

[profile.test.build-override]
debug = false
incremental = false
