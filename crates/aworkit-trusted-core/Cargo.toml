[package]
name = "aworkit-trusted-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aworkit-process = { path = "../aworkit-process" }
aworkit-protocol = { path = "../aworkit-protocol" }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
aworkit-local-store = { path = "../aworkit-local-store" }
aworkit-portable-store = { path = "../aworkit-portable-store" }
tempfile = "3"

[lints]
workspace = true
