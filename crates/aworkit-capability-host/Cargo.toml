[package]
name = "aworkit-capability-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aworkit-process = { path = "../aworkit-process" }
aworkit-protocol = { path = "../aworkit-protocol" }
cap-std = "4.0.3"
command-group = "5.0.1"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Keep the release gate focused on correctness while the pre-M12 public APIs
# are incrementally brought up to the workspace's Rust 1.97 pedantic profile.
pedantic = { level = "allow", priority = 0 }
assigning_clones = "allow"
cast_possible_truncation = "allow"
cloned_ref_to_slice_refs = "allow"
collapsible_if = "allow"
doc_markdown = "allow"
duration_suboptimal_units = "allow"
field_reassign_with_default = "allow"
format_collect = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
large_enum_variant = "allow"
large_stack_arrays = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_borrow = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
needless_question_mark = "allow"
nonminimal_bool = "allow"
op_ref = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
should_implement_trait = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
wildcard_imports = "allow"
zero_sized_map_values = "allow"
